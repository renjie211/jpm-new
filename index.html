<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPM - Jasa Push Member | RENJIEEVUCK</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* ========== RESET & BASE ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle at 30% 50%, #1a0a2e 0%, #0a0a0a 70%);
        }
        ::selection { background: #ff0055; color: #fff; }

        /* ========== PARTIKEL BACKGROUND ========== */
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            animation: floatParticle linear infinite;
        }
        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        /* ========== WRAPPER ========== */
        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ========== NAVBAR ========== */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(20,20,20,0.7);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff0055, #ffcc00, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .nav-links {
            display: flex;
            gap: 20px;
        }
        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .nav-links a:hover { color: #ff0055; }

        /* ========== HERO ========== */
        .hero {
            text-align: center;
            margin-bottom: 50px;
        }
        .hero h1 {
            font-size: 52px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff0055, #ffcc00, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowPulse 2s infinite alternate;
        }
        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 10px #ff0055); }
            100% { filter: drop-shadow(0 0 25px #00e5ff); }
        }
        .hero .subtitle {
            font-size: 15px;
            letter-spacing: 4px;
            color: #ccc;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .hero .typewriter {
            font-size: 18px;
            color: #ffcc00;
            min-height: 28px;
            margin-bottom: 40px;
        }

        /* ========== PRICING GRID ========== */
        .section-title {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff0055, #ff6600);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .pricing-card {
            background: rgba(20,20,20,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .pricing-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,0,85,0.2), transparent, rgba(0,229,255,0.2), transparent);
            animation: rotateGlow 6s linear infinite;
        }
        @keyframes rotateGlow {
            100% { transform: rotate(360deg); }
        }
        .pricing-card:hover {
            transform: translateY(-15px) scale(1.05);
            border-color: #ff0055;
            box-shadow: 0 30px 50px rgba(255,0,85,0.4);
            z-index: 2;
        }
        .card-inner {
            position: relative;
            z-index: 1;
        }
        .member-count {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #fff;
        }
        .price-tag {
            font-size: 22px;
            font-weight: 800;
            color: #00e5ff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0,229,255,0.5);
        }
        .btn-order {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 30px;
            background: linear-gradient(45deg, #ff0055, #ff6600);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            letter-spacing: 1px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255,0,85,0.3);
        }
        .btn-order:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(255,0,85,0.6);
        }

        /* ========== KALKULATOR ========== */
        .calculator {
            background: rgba(20,20,20,0.9);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 50px;
        }
        .calculator h2 {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 30px;
            color: #ffcc00;
            text-shadow: 0 0 15px rgba(255,204,0,0.5);
        }
        .calc-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }
        .calc-btn {
            padding: 10px 22px;
            border-radius: 30px;
            border: 1px solid #ff0055;
            background: transparent;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
        }
        .calc-btn:hover, .calc-btn.active {
            background: #ff0055;
            border-color: #ff0055;
            box-shadow: 0 0 20px #ff0055;
            transform: translateY(-3px);
        }
        .calc-result {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .calc-result .highlight {
            color: #00e5ff;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(0,229,255,0.8);
        }
        .calc-order {
            text-align: center;
        }

        /* ========== FOOTER ========== */
        footer {
            text-align: center;
            color: #555;
            font-size: 12px;
            margin-top: 30px;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {
            .hero h1 { font-size: 36px; }
            .navbar { flex-direction: column; gap: 10px; }
            .calc-btn { padding: 8px 16px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <!-- PARTIKEL BACKGROUND -->
    <div class="particles" id="particles"></div>

    <div class="wrapper">
        <!-- NAVBAR -->
        <nav class="navbar">
            <div class="logo">👥 JPM</div>
            <div class="nav-links">
                <a href="#price">Harga</a>
                <a href="#calculator">Kalkulator</a>
            </div>
        </nav>

        <!-- HERO -->
        <div class="hero">
            <h1>JASA PUSH MEMBER</h1>
            <div class="subtitle">Grup WA / Telegram • Anti Error • Garansi Masuk</div>
            <div class="typewriter" id="typewriter"></div>
        </div>

        <!-- PRICING -->
        <h2 class="section-title" id="price">DAFTAR HARGA</h2>
        <div class="pricing-grid" id="pricing-grid">
            <!-- Daftar harga akan di-generate oleh JavaScript -->
        </div>

        <!-- KALKULATOR -->
        <div class="calculator" id="calculator">
            <h2>🧮 KALKULATOR HARGA</h2>
            <div class="calc-buttons" id="calc-buttons">
                <!-- Tombol jumlah member -->
            </div>
            <div class="calc-result">
                Total harga untuk <span class="highlight" id="calc-member">10</span> member: <span class="highlight" id="calc-price">Rp 1.000</span>
            </div>
            <div class="calc-order">
                <a href="#" id="calc-order" class="btn-order" target="_blank">Order via WhatsApp</a>
            </div>
        </div>

        <footer>© 2026 Jasa Push Member - RENJIEEVUCK. All rights reserved. Harga bisa berubah sewaktu-waktu.</footer>
    </div>

    <script>
        // Daftar harga: jumlah member -> harga
        const priceList = [
            { member: 10, price: 1000 },
            { member: 20, price: 2000 },
            { member: 30, price: 3000 },
            { member: 40, price: 4000 },
            { member: 50, price: 5000 },
            { member: 60, price: 6000 },
            { member: 70, price: 7000 },
            { member: 80, price: 8000 },
            { member: 90, price: 9000 },
            { member: 100, price: 10000 },
            { member: 200, price: 20000 },
            { member: 300, price: 30000 },
            { member: 400, price: 40000 },
            { member: 500, price: 50000 }
        ];

        // Ganti nomor WhatsApp lo di sini (format 62xxx)
        const baseNumber = '62858xxxx'; // ⚠️ GANTI NOMOR LO!

        // Generate kartu harga
        const pricingGrid = document.getElementById('pricing-grid');
        priceList.forEach(item => {
            const card = document.createElement('div');
            card.className = 'pricing-card';
            card.innerHTML = `
                <div class="card-inner">
                    <div class="member-count">⚡ ${item.member} MEMBER</div>
                    <div class="price-tag">Rp ${item.price.toLocaleString('id-ID')}</div>
                    <a href="https://wa.me/${baseNumber}?text=Bang%20mau%20order%20JPM%20${item.member}%20member" class="btn-order" target="_blank">Order</a>
                </div>
            `;
            pricingGrid.appendChild(card);
        });

        // Generate tombol kalkulator
        const calcButtons = document.getElementById('calc-buttons');
        priceList.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'calc-btn';
            btn.dataset.member = item.member;
            btn.textContent = item.member;
            btn.addEventListener('click', () => {
                document.querySelectorAll('.calc-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updateCalculator(item.member);
            });
            calcButtons.appendChild(btn);
        });

        // Fungsi update kalkulator
        function updateCalculator(member) {
            const item = priceList.find(p => p.member === member);
            if (!item) return;
            document.getElementById('calc-member').textContent = member;
            document.getElementById('calc-price').textContent = 'Rp ' + item.price.toLocaleString('id-ID');
            document.getElementById('calc-order').href = `https://wa.me/${baseNumber}?text=Bang%20mau%20order%20JPM%20${member}%20member%20(total%20Rp%20${item.price.toLocaleString('id-ID')})`;
        }

        // Set default 10 member
        updateCalculator(10);
        document.querySelectorAll('.calc-btn')[0].classList.add('active');

        // ========== EFEK KETIKAN ==========
        const texts = [
            "Push member 24 jam...",
            "Grup lo sepi? Kita isi...",
            "Cepat, aman, anti error...",
            "JPM - solusi grup sepi...",
            "RENJIEEVUCK di atas segalanya..."
        ];
        let textIdx = 0, charIdx = 0, deleting = false;
        const typewriterEl = document.getElementById('typewriter');

        function typeLoop() {
            const current = texts[textIdx];
            if (!deleting) {
                typewriterEl.textContent = current.substring(0, charIdx + 1);
                charIdx++;
                if (charIdx === current.length) {
                    deleting = true;
                    setTimeout(typeLoop, 2000);
                    return;
                }
            } else {
                typewriterEl.textContent = current.substring(0, charIdx - 1);
                charIdx--;
                if (charIdx === 0) {
                    deleting = false;
                    textIdx = (textIdx + 1) % texts.length;
                }
            }
            setTimeout(typeLoop, deleting ? 50 : 100);
        }
        typeLoop();

        // ========== PARTIKEL BACKGROUND ==========
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 10 + 5 + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        }
        createParticles();
    </script>
</body>
</html>
